<line x1="0" y1="48.5" x2="1200" y2="48.5" stroke="#30363d"/>
<circle cx="28" cy="24" r="6" fill="#30363d"/><circle cx="48" cy="24" r="6" fill="#30363d"/><circle cx="68" cy="24" r="6" fill="#30363d"/>
<text x="600.0" y="30" text-anchor="middle" fill="#7d8590" style="font-size:15px">varun@github: ~</text>
