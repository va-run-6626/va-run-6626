<text class="on" style="animation-delay:6.46s" x="56" y="410" fill="#7d8590" font-weight="400">veni, vidi, vici.</text>
<g class="on" style="animation-delay:7.17s"><text x="56" y="460" fill="#3fb950" font-weight="700">$</text><rect class="blink" x="80.0" y="440" width="12.0" height="26" fill="#e6edf3" opacity=".85"/></g>
