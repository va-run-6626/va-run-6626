<g class="on" style="animation-delay:1.98s"><text x="56" y="214" fill="#3fb950" font-weight="700">$</text><text x="80.0" y="214" fill="#e6edf3">cat focus.txt</text><g style="animation:k1 0.71s steps(13) 1.98s forwards"><rect x="80.0" y="193" width="172.0" height="30" fill="#0d1117"/><rect class="off" style="animation-delay:2.84s" x="80.0" y="194" width="12.0" height="26" fill="#e6edf3" opacity=".85"/></g></g>
<text class="on" style="animation-delay:3.04s" x="56" y="246" fill="#e6edf3" font-weight="400">access control · data scoping · consistency · deadlines · failure handling</text>
