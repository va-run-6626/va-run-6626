<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="300" viewBox="0 0 1200 300">
<style>
@font-face { font-family: 'JBM'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'JBM'; font-weight: 700; src: url(data:font/woff2;base64,) format('woff2'); }
text { font-family: 'JBM', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; white-space: pre; }
.on { opacity: 0; animation: on 0s linear forwards; }
@keyframes on { to { opacity: 1; } }
.off { animation: off 0s linear forwards; }
@keyframes off { to { opacity: 0; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.q { opacity: 0; animation: cycle 35s linear infinite; }
@keyframes cycle { 0% { opacity: 0; } 1.71% { opacity: 1; } 18.29% { opacity: 1; } 20.00% { opacity: 0; } 100% { opacity: 0; } }

</style>
<rect x=".5" y=".5" width="1199" height="299" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M.5 48 V10.5 a10 10 0 0 1 10 -10 H1189.5 a10 10 0 0 1 10 10 V48 Z" fill="#161b22"/>
<line x1="0" y1="48.5" x2="1200" y2="48.5" stroke="#30363d"/>
<circle cx="28" cy="24" r="6" fill="#30363d"/><circle cx="48" cy="24" r="6" fill="#30363d"/><circle cx="68" cy="24" r="6" fill="#30363d"/>
<text x="600.0" y="30" text-anchor="middle" fill="#7d8590" style="font-size:15px">fortune</text>
<text x="56" y="100" fill="#3fb950" font-weight="700">$</text><text x="80.0" y="100" fill="#e6edf3">fortune stoic</text>
<g class="q" style="animation-delay:0s"><text x="56" y="140" fill="#e6edf3">The impediment to action advances action.</text><text x="56" y="172" fill="#e6edf3">What stands in the way becomes the way.</text><text x="56" y="212" fill="#7d8590">    — Marcus Aurelius, Meditations</text></g>
<g class="q" style="animation-delay:7s"><text x="56" y="140" fill="#e6edf3">It is not that we have a short time to live,</text><text x="56" y="172" fill="#e6edf3">but that we waste a lot of it.</text><text x="56" y="212" fill="#7d8590">    — Seneca, On the Shortness of Life</text></g>
<g class="q" style="animation-delay:14s"><text x="56" y="140" fill="#e6edf3">No man is free</text><text x="56" y="172" fill="#e6edf3">who is not master of himself.</text><text x="56" y="212" fill="#7d8590">    — Epictetus</text></g>
<g class="q" style="animation-delay:21s"><text x="56" y="140" fill="#e6edf3">Waste no more time arguing about what</text><text x="56" y="172" fill="#e6edf3">a good man should be. Be one.</text><text x="56" y="212" fill="#7d8590">    — Marcus Aurelius, Meditations</text></g>
<g class="q" style="animation-delay:28s"><text x="56" y="140" fill="#e6edf3">We suffer more often</text><text x="56" y="172" fill="#e6edf3">in imagination than in reality.</text><text x="56" y="212" fill="#7d8590">    — Seneca, Letters to Lucilius</text></g>
<text x="56" y="260" fill="#3fb950" font-weight="700">$</text><rect class="blink" x="80.0" y="240" width="12.0" height="26" fill="#e6edf3" opacity=".85"/>
</svg>
